proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=my_cache:10m max_size=100m inactive=60m use_temp_path=off;
limit_req_zone $binary_remote_addr zone=antiddos:10m rate=5r/s;

server {
    server_name lynxlunarcs.duckdns.org;
    client_max_body_size 64M;

    root /var/www/html;
    index index.php index.html index.htm;

    # 1. ซ่อนเวอร์ชัน Nginx และ OS
    server_tokens off;

    # 2. Security Headers กลาง
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 3. ดักจับการพยายามเจาะระบบด้วย SQL Injection หรือ XSS ผ่าน URL
    if ($query_string ~* "(union.*select|concat.*\(|<script>|base64_encode|\.\./)") {
        return 403;
    }

    # 4. บล็อกไฟล์ระบบและไฟล์ลับ (.git, .env, phpmyadmin, config, backup)
    location ~* /(\.git|\.env|phpmyadmin|config|backup) {
        deny all;
        return 403;
    }

    # 5. จัดการเส้นทางหน้าเว็บ WordPress และ Anti-DDoS
    location / {
        limit_req zone=antiddos burst=10 nodelay;
        try_files $uri $uri/ /index.php?$args;
    }

    # 6. ประมวลผลไฟล์ PHP ผ่าน PHP-FPM 8.3
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        # ส่งต่อ Security Headers เข้ามาในบล็อก PHP
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # 7. [SEC-02] บล็อก XML-RPC ป้องกัน Brute-force & DDoS
    location = /xmlrpc.php {
        deny all;
        return 403;
    }

    # 8. [SEC-01] บล็อก REST API แสดงรายชื่อ User
    location ~ ^/wp-json/wp/v2/users {
        deny all;
        return 403;
    }
# บล็อก Author Enumeration (ป้องกันบอทสแกนหา Username แอดมิน)
    location ~* ^/author/ {
        return 403;
    }

    if ($query_string ~* "^author=[0-9]+") {
        return 403;
    }

    # 9. [CRITICAL FIX] บล็อก wp-config.php, readme.html และ license.txt
    location ~* /(wp-config\.php|readme\.html|license\.txt) {
        deny all;
        return 403;
    }

    # 10. บล็อกการรันสคริปต์ PHP ในโฟลเดอร์ Uploads
    location /wp-content/uploads/ {
        location ~ \.php$ {
            deny all;
        }
    }

    # บล็อกการดึงรายชื่อผู้ใช้ผ่าน REST API
    location ~* ^/wp-json/wp/v2/users {
         return 403;
}

    # บล็อกการสืบค้นชื่อผู้เขียนผ่าน URL
    location ~* ^/author/ {
         return 403;
}
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/lynxlunarcs.duckdns.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/lynxlunarcs.duckdns.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = lynxlunarcs.duckdns.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    server_tokens off;

    listen 80;
    server_name lynxlunarcs.duckdns.org;
    return 404; # managed by Certbot
}
